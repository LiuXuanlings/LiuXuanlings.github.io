<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兮兮轩灵的奇妙之旅</title>
    <!-- 使用Tailwind CSS Play CDN，关闭preflight减少警告 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            corePlugins: {
                preflight: false,
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;700&display=swap');
        
        * {
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Noto Serif SC', serif;
        }
        
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        .password-shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        /* 防止页面滚动 */
        .fixed.inset-0 {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #f472b6, #a855f7);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(to bottom, #ec4899, #9333ea);
        }

        /* 动画样式 */
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.5s ease;
        }

        .fade-enter-from, .fade-leave-to {
            opacity: 0;
        }

        .slide-fade-enter-active, .slide-fade-leave-active {
            transition: all 0.5s ease;
        }

        .slide-fade-enter-from {
            opacity: 0;
            transform: translateX(30px);
        }

        .slide-fade-leave-to {
            opacity: 0;
            transform: translateX(-30px);
        }

        .expand-enter-active, .expand-leave-active {
            transition: all 0.5s ease;
            overflow: hidden;
        }

        .expand-enter-from, .expand-leave-to {
            opacity: 0;
            max-height: 0;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .timeline-event {
                flex-direction: column !important;
            }
            
            .timeline-event > div {
                width: 100% !important;
            }
            
            .timeline-event .absolute {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">

        createApp({
            template: `
                <div class="min-h-screen bg-gradient-to-br from-rose-50 via-purple-50 to-blue-50">
                    <!-- GitHub Token验证页面 -->
                    <transition name="fade" appear>
                        <div v-if="currentStage === 'token'" class="fixed inset-0 flex items-center justify-center bg-gradient-to-br from-rose-50 via-purple-50 to-blue-50">
                            <div class="relative z-10 text-center max-w-md w-full mx-4">
                                <!-- Token输入框 -->
                                <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-8 md:p-10">
                                    <!-- 锁图标 -->
                                    <div class="mb-8">
                                        <div class="w-24 h-24 mx-auto bg-gradient-to-r from-rose-400 to-purple-400 rounded-full flex items-center justify-center">
                                            <i class="fas fa-key text-4xl text-white"></i>
                                        </div>
                                    </div>

                                    <!-- 标题 -->
                                    <h1 class="text-3xl md:text-4xl font-bold mb-4 bg-gradient-to-r from-rose-400 via-purple-400 to-blue-400 bg-clip-text text-transparent">
                                        私人纪念册
                                    </h1>
                                    <p class="text-gray-600 mb-8 text-lg">
                                        请输入GitHub Personal Access Token
                                    </p>

                                    <!-- Token输入框 -->
                                    <div class="mb-6 relative">
                                        <div class="relative">
                                            <input
                                                v-model="githubToken"
                                                @keyup.enter="verifyGitHubToken"
                                                :type="showToken ? 'text' : 'password'"
                                                placeholder="输入GitHub Personal Access Token"
                                                class="w-full px-6 py-4 text-lg rounded-full border-2 focus:outline-none focus:ring-4 transition-all duration-300"
                                                :class="[tokenError ? 'border-red-400 focus:ring-red-200' : 'border-gray-200 focus:border-rose-400 focus:ring-rose-200', tokenShake ? 'password-shake' : '']"
                                                ref="tokenInputRef"
                                            >
                                            <button
                                                @click="toggleTokenVisibility"
                                                type="button"
                                                class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                                            >
                                                <i :class="showToken ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                                            </button>
                                        </div>

                                        <!-- 错误提示 -->
                                        <transition name="fade" appear>
                                            <div v-if="tokenError" class="mt-3 p-3 bg-red-50 border border-red-200 rounded-xl">
                                                <p class="text-red-600 text-sm flex items-center">
                                                    <i class="fas fa-exclamation-circle mr-2"></i>
                                                    {{ tokenErrorMessage }}
                                                </p>
                                            </div>
                                        </transition>

                                        <!-- Token获取帮助 -->
                                        <div class="mt-4 p-4 bg-blue-50 rounded-xl">
                                            <p class="text-sm text-blue-800 mb-2">
                                                <i class="fas fa-info-circle mr-1"></i> 如何获取Token？
                                            </p>
                                            <ol class="text-sm text-blue-700 text-left list-decimal pl-5 space-y-1">
                                                <li>访问 <a href="https://github.com/settings/tokens" target="_blank" class="text-blue-600 hover:text-blue-800 underline">GitHub Tokens设置</a></li>
                                                <li>点击 "Generate new token (classic)"</li>
                                                <li>勾选 <code class="bg-blue-100 px-1 rounded">repo</code> 权限</li>
                                                <li>点击 "Generate token" 并复制</li>
                                            </ol>
                                            <p class="text-xs text-blue-600 mt-2">
                                                只需要设置一次，Token会安全存储在您的浏览器中
                                            </p>
                                        </div>
                                    </div>

                                    <!-- 提交按钮 -->
                                    <button
                                        @click="verifyGitHubToken"
                                        :disabled="!githubToken"
                                        class="w-full px-8 py-4 bg-gradient-to-r from-rose-400 to-purple-400 text-white rounded-full font-medium hover:shadow-lg transform hover:scale-[1.02] transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
                                    >
                                        <span class="flex items-center justify-center">
                                            <i class="fab fa-github mr-2"></i>
                                            验证Token并进入
                                        </span>
                                    </button>

                                    <!-- 安全提示 -->
                                    <div class="mt-6 text-xs text-gray-500">
                                        <p><i class="fas fa-shield-alt mr-1"></i> Token仅用于读写您的日记数据，不会用于其他用途</p>
                                    </div>
                                </div>

                                <!-- 装饰元素 -->
                                <div class="absolute -top-8 -left-8 w-20 h-20 bg-rose-200 rounded-full opacity-20 animate-pulse"></div>
                                <div class="absolute -bottom-6 -right-6 w-24 h-24 bg-purple-200 rounded-full opacity-20 animate-pulse"></div>
                                <div class="absolute top-16 -right-4 w-16 h-16 bg-blue-200 rounded-full opacity-20 animate-pulse"></div>
                            </div>
                        </div>
                    </transition>

                    <!-- 背景音乐控制 -->
                    <audio id="introAudio" ref="introAudio" @ended="onIntroAudioEnd">
                        <source :src="audioResources.intro" type="audio/mp3">
                    </audio>
                    <audio id="backgroundAudio" ref="backgroundAudio" loop>
                        <source :src="audioResources.background" type="audio/mp3">
                    </audio>

                    <!-- 音量控制 -->
                    <div v-if="showVolumeControl && currentStage !== 'token'" class="fixed bottom-4 right-4 z-50 bg-white rounded-full p-2 shadow-md">
                        <button @click="toggleMute" class="text-gray-600 hover:text-gray-800">
                            <i :class="muted ? 'fas fa-volume-mute' : 'fas fa-volume-up'"></i>
                        </button>
                    </div>

                    <!-- 封面页面 -->
                    <transition name="fade" appear>
                        <div v-if="currentStage === 'entrance'" class="fixed inset-0 flex items-center justify-center">
                            <!-- 礼物盒封面 -->
                            <div class="relative z-10 text-center">
                                <!-- 礼物盒图片 -->
                                <div class="mb-8 relative">
                                    <img 
                                        :src="imageResources.cover" 
                                        alt="生日礼物盒"
                                        class="w-80 h-80 mx-auto object-contain drop-shadow-2xl transform hover:scale-105 transition-transform duration-500"
                                        :class="{ 'animate-pulse': isBoxAnimating }"
                                    >
                                </div>
                                
                                <!-- 生日祝福语 -->
                                <h1 class="text-4xl md:text-6xl font-bold mb-4 bg-gradient-to-r from-rose-400 via-purple-400 to-blue-400 bg-clip-text text-transparent">
                                    {{ birthdayMessage }}
                                </h1>
                                <p class="text-xl md:text-2xl text-gray-600 mb-12 font-light">
                                    {{ birthdaySubtitle }}
                                </p>
                                
                                <!-- 解锁按钮 -->
                                <button 
                                    @click="unlockMemoryBook"
                                    class="group relative inline-flex items-center justify-center px-8 py-4 bg-white rounded-full shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-300"
                                >
                                    <img 
                                        :src="imageResources.key" 
                                        alt="解锁钥匙"
                                        class="w-8 h-8 mr-3 group-hover:rotate-12 transition-transform duration-300"
                                    >
                                    <span class="text-lg font-medium text-gray-700">{{ unlockButtonText }}</span>

                                    <!-- 闪烁效果 -->
                                    <div class="absolute inset-0 rounded-full bg-gradient-to-r from-rose-200 via-purple-200 to-blue-200 opacity-0 group-hover:opacity-30 transition-opacity duration-300 animate-pulse"></div>
                                </button>

                                <!-- 快捷入口：心情日记 -->
                                <div class="mt-8">
                                    <button
                                        @click="goToMoodCalendar"
                                        class="group relative inline-flex items-center justify-center px-6 py-3 bg-gradient-to-r from-green-400 to-blue-400 text-white rounded-full shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-300"
                                    >
                                        <i class="fas fa-calendar-alt mr-2 group-hover:rotate-12 transition-transform duration-300"></i>
                                        <span class="font-medium">📝 心情日记</span>
                                        <div class="absolute inset-0 rounded-full bg-gradient-to-r from-green-500 to-blue-500 opacity-0 group-hover:opacity-20 transition-opacity duration-300"></div>
                                    </button>
                                    <p class="text-sm text-gray-500 mt-2">直接进入心情日记，记录每日点滴</p>
                                </div>
                            </div>
                        </div>
                    </transition>

                    <!-- 主内容页面 -->
                    <transition name="fade" appear>
                        <div v-if="currentStage === 'main'" class="min-h-screen">
                            <!-- 导航栏 -->
                            <nav class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-md shadow-sm">
                                <div class="max-w-6xl mx-auto px-4 py-4">
                                    <div class="flex items-center justify-between">
                                        <h2 class="text-2xl font-bold bg-gradient-to-r from-rose-400 to-purple-400 bg-clip-text text-transparent">
                                            {{ navTitle }}
                                        </h2>
                                        <div class="flex space-x-6">
                                            <button 
                                                v-for="tab in tabs" 
                                                :key="tab.id"
                                                @click="activeTab = tab.id"
                                                class="px-4 py-2 rounded-full text-sm font-medium transition-all duration-300"
                                                :class="activeTab === tab.id ? 'bg-rose-100 text-rose-600' : 'text-gray-600 hover:text-rose-600'"
                                            >
                                                {{ tab.name }}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </nav>

                            <!-- 主内容区域 -->
                            <main class="pt-24 pb-12">
                                <div class="max-w-6xl mx-auto px-4">
                                    <!-- 时间胶囊模块 -->
                                    <transition name="slide-fade" appear>
                                        <div v-if="activeTab === 'timeline'" class="space-y-8">
                                            <div class="text-center mb-12">
                                                <h3 class="text-3xl font-bold text-gray-800 mb-4">{{ timelineTitle }}</h3>
                                                <p class="text-lg text-gray-600">{{ timelineSubtitle }}</p>
                                            </div>
                                            
                                            <!-- 时间轴 -->
                                            <div class="relative">
                                                <!-- 时间轴线 -->
                                                <div class="absolute left-1/2 transform -translate-x-1/2 w-1 h-full bg-gradient-to-b from-rose-200 via-purple-200 to-blue-200 rounded-full"></div>
                                                
                                                <!-- 时间节点 -->
                                                <div v-for="(event, index) in timelineData" :key="index" class="relative mb-12">
                                                    <div class="flex items-center" :class="index % 2 === 0 ? 'flex-row' : 'flex-row-reverse'">
                                                        <!-- 内容卡片 -->
                                                        <div class="w-5/12">
                                                            <div 
                                                                class="bg-white rounded-2xl shadow-lg p-6 cursor-pointer transform hover:scale-105 transition-all duration-300"
                                                                @click="toggleTimelineEvent(index)"
                                                            >
                                                                <div class="flex items-center justify-between mb-4">
                                                                    <span class="text-2xl font-bold text-rose-500">{{ event.year }}</span>
                                                                    <i class="fas fa-chevron-down transition-transform duration-300" :class="{ 'rotate-180': event.expanded }"></i>
                                                                </div>
                                                                <h4 class="text-xl font-semibold text-gray-800 mb-2">{{ event.title }}</h4>
                                                                
                                                                <!-- 展开内容 -->
                                                                <transition name="expand">
                                                                    <div v-if="event.expanded" class="mt-4">
                                                                        <p class="text-gray-600 mb-4">{{ event.description }}</p>
                                                                        
                                                                        <!-- 图片画廊 -->
                                                                        <div class="relative mb-4">
                                                                            <div class="grid grid-cols-2 gap-4">
                                                                                <img 
                                                                                    v-for="(img, imgIndex) in event.images" 
                                                                                    :key="imgIndex"
                                                                                    :src="img" 
                                                                                    :alt="event.title"
                                                                                    class="w-full h-32 object-cover rounded-lg shadow-md cursor-pointer"
                                                                                    @click="openImageGallery('timeline', index, imgIndex)"
                                                                                >
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </transition>
                                                            </div>
                                                        </div>
                                                        
                                                        <!-- 中心点 -->
                                                        <div class="w-2/12 flex justify-center">
                                                            <div class="w-6 h-6 bg-rose-400 rounded-full border-4 border-white shadow-lg z-10"></div>
                                                        </div>
                                                        
                                                        <!-- 空白区域 -->
                                                        <div class="w-5/12"></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </transition>

                                    <!-- 照片精选模块 -->
                                    <transition name="slide-fade" appear>
                                        <div v-if="activeTab === 'photoGallery'" class="space-y-12">
                                            <div class="text-center mb-12">
                                                <h3 class="text-3xl font-bold text-gray-800 mb-4">{{ galleryTitle }}</h3>
                                                <p class="text-lg text-gray-600">{{ gallerySubtitle }}</p>
                                            </div>
                                            
                                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                                <div v-for="(album, albumIndex) in photoAlbums" :key="albumIndex" class="bg-white rounded-2xl shadow-lg overflow-hidden">
                                                    <!-- 相册封面 -->
                                                    <div class="relative">
                                                        <img 
                                                            :src="album.cover" 
                                                            :alt="album.title"
                                                            class="w-full h-48 object-cover cursor-pointer" 
                                                            @click="toggleAlbum(albumIndex)"
                                                        >
                                                    </div>
                                                    
                                                    <div class="p-6">
                                                        <h4 class="text-xl font-semibold text-gray-800 mb-4">{{ album.title }}</h4>
                                                        <p class="text-gray-600 mb-6">{{ album.description }}</p>
                                                    </div>
                                                    
                                                    <!-- 相册内容 -->
                                                    <transition name="slide-fade">
                                                        <div v-if="album.expanded" class="grid grid-cols-3 gap-2 p-4">
                                                            <img 
                                                                v-for="(img, imgIndex) in album.images.slice(0, 6)" 
                                                                :key="imgIndex"
                                                                :src="img" 
                                                                :alt="album.title"
                                                                class="w-full h-24 md:h-32 object-cover rounded-lg cursor-pointer"
                                                                @click="openImageGallery('gallery', albumIndex, imgIndex)"
                                                                :class="getPhotoShape()"
                                                            >
                                                        </div>
                                                    </transition>
                                                </div>
                                            </div>
                                        </div>
                                    </transition>

                                    <!-- 默契测试模块 -->
                                    <transition name="slide-fade" appear>
                                        <div v-if="activeTab === 'quiz'" class="max-w-2xl mx-auto">
                                            <div class="text-center mb-12">
                                                <h3 class="text-3xl font-bold text-gray-800 mb-4">{{ quizTitle }}</h3>
                                                <p class="text-lg text-gray-600">{{ quizSubtitle }}</p>
                                            </div>
                                            
                                            <!-- 进度条 -->
                                            <div class="mb-8">
                                                <div class="flex justify-between text-sm text-gray-600 mb-2">
                                                    <span>进度</span>
                                                    <span>{{ currentQuestion + 1 }} / {{ quizData.length }}</span>
                                                </div>
                                                <div class="w-full bg-gray-200 rounded-full h-2">
                                                    <div 
                                                        class="bg-gradient-to-r from-rose-400 to-purple-400 h-2 rounded-full transition-all duration-500"
                                                        :style="\`width: \${((currentQuestion + 1) / quizData.length) * 100}%\`"
                                                    ></div>
                                                </div>
                                            </div>
                                            
                                            <!-- 题目卡片 -->
                                            <div class="bg-white rounded-2xl shadow-lg p-8 mb-6">
                                                <h4 class="text-xl font-semibold text-gray-800 mb-6">
                                                    {{ quizData[currentQuestion].question }}
                                                </h4>
                                                
                                                <!-- 选项 -->
                                                <div class="space-y-3">
                                                    <button
                                                        v-for="(option, index) in quizData[currentQuestion].options"
                                                        :key="index"
                                                        @click="selectAnswer(index)"
                                                        class="w-full p-4 text-left rounded-xl border-2 transition-all duration-300"
                                                        :class="getOptionClass(index)"
                                                        :disabled="quizData[currentQuestion].userAnswer !== null"
                                                    >
                                                        <div class="flex items-center justify-between">
                                                            <span>{{ option }}</span>
                                                            <i v-if="showAnswerIcon(index)" :class="getAnswerIcon(index)"></i>
                                                        </div>
                                                    </button>
                                                </div>
                                                
                                                <!-- 答案解释 -->
                                                <transition name="fade" appear>
                                                    <div v-if="quizData[currentQuestion].userAnswer !== null" class="mt-6 p-4 bg-blue-50 rounded-xl">
                                                        <p class="text-blue-800">
                                                            <i class="fas fa-lightbulb mr-2"></i>
                                                            {{ quizData[currentQuestion].explanation }}
                                                        </p>
                                                    </div>
                                                </transition>
                                            </div>
                                            
                                            <!-- 下一题按钮 -->
                                            <div class="text-center">
                                                <button
                                                    v-if="quizData[currentQuestion].userAnswer !== null && currentQuestion < quizData.length - 1"
                                                    @click="nextQuestion"
                                                    class="px-8 py-3 bg-gradient-to-r from-rose-400 to-purple-400 text-white rounded-full font-medium hover:shadow-lg transform hover:scale-105 transition-all duration-300"
                                                >
                                                    下一题
                                                </button>
                                                
                                                <!-- 完成测试 -->
                                                <button
                                                    v-if="quizData[currentQuestion].userAnswer !== null && currentQuestion === quizData.length - 1"
                                                    @click="showQuizResult"
                                                    class="px-8 py-3 bg-gradient-to-r from-rose-400 to-purple-400 text-white rounded-full font-medium hover:shadow-lg transform hover:scale-105 transition-all duration-300"
                                                >
                                                    查看结果
                                                </button>
                                            </div>
                                            
                                            <!-- 得分显示 -->
                                            <div class="text-center mt-6">
                                                <span class="text-2xl font-bold text-rose-500">{{ quizScore }} / {{ quizData.length }}</span>
                                            </div>
                                        </div>
                                    </transition>

                                    <!-- 情话电台模块 -->
                                    <transition name="slide-fade" appear>
                                        <div v-if="activeTab === 'radio'" class="max-w-4xl mx-auto">
                                            <div class="text-center mb-12">
                                                <h3 class="text-3xl font-bold text-gray-800 mb-4">{{ radioTitle }}</h3>
                                                <p class="text-lg text-gray-600">{{ radioSubtitle }}</p>
                                            </div>
                                            
                                            <!-- 收音机界面 -->
                                            <div class="bg-white rounded-2xl shadow-lg p-8 mb-8">
                                                <div class="flex items-center justify-center mb-8">
                                                    <img 
                                                        :src="imageResources.radio" 
                                                        alt="情话电台"
                                                        class="w-80 h-60 object-contain"
                                                    >
                                                </div>
                                                
                                                <!-- 频道选择 -->
                                                <div class="flex justify-center space-x-6">
                                                    <button
                                                        @click="switchChannel('letter')"
                                                        class="px-6 py-3 rounded-full font-medium transition-all duration-300"
                                                        :class="currentChannel === 'letter' ? 'bg-rose-100 text-rose-600 shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
                                                    >
                                                        <i class="fas fa-envelope mr-2"></i>
                                                        频道 A - 情书
                                                    </button>
                                                    
                                                    <button
                                                        @click="switchChannel('video')"
                                                        class="px-6 py-3 rounded-full font-medium transition-all duration-300"
                                                        :class="currentChannel === 'video' ? 'bg-purple-100 text-purple-600 shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
                                                    >
                                                        <i class="fas fa-video mr-2"></i>
                                                        频道 B - 视频
                                                    </button>
                                                </div>
                                                
                                                <!-- 频道内容 -->
                                                <transition name="fade" appear>
                                                    <div v-if="currentChannel === 'letter'" class="mt-8 text-center">
                                                        <p class="text-gray-600 mb-4">点击打开我的手写情书</p>
                                                        <button
                                                            @click="openLoveLetter"
                                                            class="px-6 py-3 bg-rose-100 text-rose-600 rounded-full hover:bg-rose-200 transition-colors duration-300"
                                                        >
                                                            <i class="fas fa-heart mr-2"></i>
                                                            打开情书
                                                        </button>
                                                    </div>
                                                </transition>
                                                
                                                <transition name="fade" appear>
                                                    <div v-if="currentChannel === 'video'" class="mt-8 text-center">

                // 验证GitHub Token
                async function validateGitHubToken(token) {
                    try {
                        const response = await fetch('https://api.github.com/user', {
                            headers: {
                                'Authorization': `token ${token}`,
                                'Accept': 'application/vnd.github.v3+json'
                            }
                        })
                        return response.ok
                    } catch {
                        return false
                    }
                }

                // 保存GitHub Token到localStorage
                function saveGitHubToken(token) {
                    try {
                        const encoded = btoa(token) // 简单base64编码
                        localStorage.setItem('github_token', encoded)
                        localStorage.setItem('github_token_verified', 'true')
                        localStorage.setItem('github_token_saved_at', new Date().toISOString())
                        return true
                    } catch (error) {
                        console.error('保存Token失败:', error)
                        return false
                    }
                }

                // 获取存储的GitHub Token
                function getStoredGitHubToken() {
                    try {
                        const encoded = localStorage.getItem('github_token')
                        if (!encoded) return null

                        const savedAt = localStorage.getItem('github_token_saved_at')
                        if (savedAt) {
                            const savedDate = new Date(savedAt)
                            const now = new Date()
                            const diffDays = Math.floor((now - savedDate) / (1000 * 60 * 60 * 24))

                            // Token保存超过30天，建议重新验证
                            if (diffDays > 30) {
                                console.log('Token已保存超过30天，建议重新验证')
                            }
                        }

                        return atob(encoded)
                    } catch (error) {
                        console.error('读取Token失败:', error)
                        return null
                    }
                }

                    try {

                        const verified = localStorage.getItem('github_token_verified') === 'true'

                // ==================== 心情日历方法 ====================

                    const year = currentYear.value
                    const month = currentMonth.value

                    // 获取当月第一天和最后一天
                    const firstDay = new Date(year, month, 1)
                    const lastDay = new Date(year, month + 1, 0)

                    // 获取当月第一天是星期几（0-6，0代表星期日）
                    const firstDayOfWeek = firstDay.getDay()

                    // 获取上个月的最后几天
                    const prevMonthLastDay = new Date(year, month, 0).getDate()

                    // 生成日历数组
                    const days = []

                    // 添加上个月的日期
                    for (let i = firstDayOfWeek - 1; i >= 0; i--) {
                        const date = new Date(year, month - 1, prevMonthLastDay - i)
                        days.push({
                            date,
                            isCurrentMonth: false,
                            isToday: false
                        })
                    }

                    // 添加当月的日期
                    const today = new Date()
                    for (let i = 1; i <= lastDay.getDate(); i++) {
                        const date = new Date(year, month, i)
                        days.push({
                            date,
                            isCurrentMonth: true,
                            isToday: date.getDate() === today.getDate() &&
                                     date.getMonth() === today.getMonth() &&
                                     date.getFullYear() === today.getFullYear()
                        })
                    }

                    // 添加下个月的日期（补满42个格子）
                    const nextMonthDays = 42 - days.length
                    for (let i = 1; i <= nextMonthDays; i++) {
                        const date = new Date(year, month + 1, i)
                        days.push({
                            date,
                            isCurrentMonth: false,
                            isToday: false
                        })
                    }

                    calendarDays.value = days
                    updateMonthStats()
                }

                        }

                    if (!day || !day.isCurrentMonth) return false
                    const dateStr = formatDate(day.date)
                    return !!moodRecords.value[dateStr]
                }

                // 获取某天的心情表情
                const getMoodEmoji = (day) => {
                    if (!day) return ''
                    const dateStr = formatDate(day.date)
                    return moodRecords.value[dateStr]?.mood || ''
                }

                // 获取某天的心情文字预览
                const getMoodTextPreview = (day) => {
                    if (!day) return ''
                    const dateStr = formatDate(day.date)
                    const text = moodRecords.value[dateStr]?.text || ''
                    return text.length > 8 ? text.substring(0, 8) + '...' : text
                }

                // 获取心情颜色的CSS类
                const getMoodColorClass = (mood) => {
                    const colorMap = {
                        '😊': 'bg-yellow-500',
                        '😢': 'bg-blue-500',
                        '😠': 'bg-red-500',
                        '🥰': 'bg-pink-500',
                        '❤️': 'bg-red-500',
                        '🤔': 'bg-gray-500',
                        '😴': 'bg-purple-500',
                        '😎': 'bg-cyan-500',
                        '😭': 'bg-indigo-500',
                        '😍': 'bg-rose-500',
                        '☀️': 'bg-orange-500',
                        '🌧️': 'bg-blue-500',
                        '🌈': 'bg-gradient-to-r from-pink-500 via-purple-500 to-blue-500',
                        '⛄': 'bg-blue-300',
                        '🎉': 'bg-pink-500',
                        '🎂': 'bg-yellow-500',
                        '📝': 'bg-green-500',
                        '✏️': 'bg-gray-500',
                        '📅': 'bg-indigo-500',
                        '🌟': 'bg-yellow-500'
                    }
                    return colorMap[mood] || 'bg-gray-500'
                }

                // 格式化日期为YYYY-MM-DD
                const formatDate = (date) => {
                    const year = date.getFullYear()
                    const month = String(date.getMonth() + 1).padStart(2, '0')
                    const day = String(date.getDate()).padStart(2, '0')
                    return `${year}-${month}-${day}`
                }

                // 上一个月
                const prevMonth = () => {
                    if (currentMonth.value === 0) {
                        currentMonth.value = 11
                        currentYear.value -= 1
                    } else {
                        currentMonth.value -= 1
                    }
                    generateCalendar()
                }

                // 下一个月
                const nextMonth = () => {
                    if (currentMonth.value === 11) {
                        currentMonth.value = 0
                        currentYear.value += 1
                    } else {
                        currentMonth.value += 1
                    }
                    generateCalendar()
                }

                // 跳转到今天
                const goToToday = () => {
                    const today = new Date()
                    currentYear.value = today.getFullYear()
                    currentMonth.value = today.getMonth()
                    generateCalendar()
                }

                // 打开心情编辑器
                const openMoodEditor = (day) => {
                    if (!day || !day.isCurrentMonth) return

                    const dateStr = formatDate(day.date)
                    const existingRecord = moodRecords.value[dateStr]

                    editingDate.value = day.date
                    editingMood.value = existingRecord?.mood || ''
                    editingText.value = existingRecord?.text || ''
                    hasExistingRecord.value = !!existingRecord
                    saveError.value = ''
                    showMoodEditor.value = true
                }

                // 关闭心情编辑器
                const closeMoodEditor = () => {
                    showMoodEditor.value = false
                    editingDate.value = null
                    editingMood.value = ''
                    editingText.value = ''
                    hasExistingRecord.value = false
                    saveError.value = ''
                }

                // 选择心情
                const selectMood = (mood) => {
                    editingMood.value = mood
                }

                // 获取表情按钮的CSS类
                const getMoodButtonClass = (mood) => {
                    const baseClass = 'border-2 '
                    if (editingMood.value === mood) {
                        return baseClass + 'border-rose-400 bg-gradient-to-br ' + (moodColors[mood] || 'from-gray-100 to-gray-300') + ' scale-110'
                    }
                    return baseClass + 'border-gray-200 hover:border-gray-300 hover:bg-gray-50'
                }

                // 获取表情描述
                const getMoodDescription = (mood) => {
                    const descriptions = {
                        '😊': '开心', '😢': '难过', '😠': '生气', '🥰': '喜爱', '❤️': '爱心',
                        '🤔': '思考', '😴': '困倦', '😎': '酷', '😭': '大哭', '😍': '爱心眼',
                        '☀️': '晴天', '🌧️': '雨天', '🌈': '彩虹', '⛄': '雪人', '🎉': '庆祝',
                        '🎂': '生日', '📝': '写作', '✏️': '铅笔', '📅': '日历', '🌟': '星星'
                    }
                    return descriptions[mood] || mood
                }

                // 格式化编辑器中的日期显示
                const formatEditorDate = (date) => {
                    const months = ['一月', '二月', '三月', '四月', '五月', '六月',
                                  '七月', '八月', '九月', '十月', '十一月', '十二月']
                    const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六']

                    const year = date.getFullYear()
                    const month = months[date.getMonth()]
                    const day = date.getDate()
                    const weekDay = weekDays[date.getDay()]

                    return `${year}年${month}${day}日 ${weekDay}`
                }

                // 保存心情记录
                const saveMoodRecord = async () => {
                    if (!editingMood.value || !editingDate.value) {
                        saveError.value = '请选择心情'
                        return
                    }

                    isSaving.value = true
                    saveError.value = ''

                    const dateStr = formatDate(editingDate.value)
                    const record = {
                        mood: editingMood.value,
                        text: editingText.value.trim(),
                        timestamp: new Date().toISOString()
                    }

                    try {
                        // 更新本地记录
                        moodRecords.value = {
                            ...moodRecords.value,
                            [dateStr]: record
                        }

                        // 更新当前月份的统计
                        updateMonthStats()

                        // 保存到GitHub
                        const token = getStoredGitHubToken()
                        if (token) {
                            const diaryData = {
                                version: '1.0',
                                lastUpdated: new Date().toISOString(),
                                records: moodRecords.value
                            }

                            await saveDiaryToGitHub(token, diaryData)
                        } else {
                            console.warn('没有GitHub Token，仅保存到本地')
                        }

                        // 关闭编辑器
                        closeMoodEditor()
                    } catch (error) {
                        console.error('保存心情记录失败:', error)
                        saveError.value = `保存失败: ${error.message}`
                    } finally {
                        isSaving.value = false
                    }
                }

                // 删除心情记录
                const deleteMoodRecord = async () => {
                    if (!confirm('确定要删除这条记录吗？')) {
                        return
                    }

                    const dateStr = formatDate(editingDate.value)

                    try {
                        // 从本地记录中删除
                        const newRecords = { ...moodRecords.value }
                        delete newRecords[dateStr]
                        moodRecords.value = newRecords

                        // 更新当前月份的统计
                        updateMonthStats()

                        // 保存到GitHub
                        const token = getStoredGitHubToken()
                        if (token) {
                            const diaryData = {
                                version: '1.0',
                                lastUpdated: new Date().toISOString(),
                                records: moodRecords.value
                            }

                            await saveDiaryToGitHub(token, diaryData)
                        }

                        // 关闭编辑器
                        closeMoodEditor()
                    } catch (error) {
                        console.error('删除心情记录失败:', error)
                        saveError.value = `删除失败: ${error.message}`
                    }
                }

                // 导出心情数据
                const exportMoodData = () => {
                    const recordCount = Object.keys(moodRecords.value).length
                    if (recordCount === 0) {
                        alert('暂无数据可导出')
                        return
                    }

                    const data = {
                        version: '1.0',
                        lastUpdated: new Date().toISOString(),
                        totalRecords: recordCount,
                        records: moodRecords.value
                    }

                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
                    const url = URL.createObjectURL(blob)
                    const a = document.createElement('a')
                    a.href = url
                    a.download = `mood-diary-${new Date().toISOString().split('T')[0]}.json`
                    document.body.appendChild(a)
                    a.click()
                    document.body.removeChild(a)
                    URL.revokeObjectURL(url)

                    alert(`已导出 ${recordCount} 条心情记录！\n\n文件名: ${a.download}`)
                }

                // 导入心情数据
                const importMoodData = () => {
                    const input = document.createElement('input')
                    input.type = 'file'
                    input.accept = 'application/json,.json'

                    input.onchange = async (e) => {
                        const file = e.target.files[0]
                        if (!file) return

                        // 检查文件大小（限制为5MB）
                        if (file.size > 5 * 1024 * 1024) {
                            alert('文件太大，请选择小于5MB的JSON文件')
                            return
                        }

                        const reader = new FileReader()
                        reader.onload = async (event) => {
                            try {
                                const data = JSON.parse(event.target.result)

                                // 验证数据格式
                                if (!data.version || !data.records || typeof data.records !== 'object') {
                                    alert('文件格式不正确！请确保是导出的心情日记文件。')
                                    return
                                }

                                // 询问用户确认
                                const recordCount = Object.keys(data.records).length
                                const confirmMessage = `发现 ${recordCount} 条记录。\n\n导入将覆盖当前所有数据，确定要继续吗？`

                                if (!confirm(confirmMessage)) {
                                    return
                                }

                                // 更新数据
                                moodRecords.value = data.records
                                generateCalendar()

                                // 尝试保存到GitHub
                                const token = getStoredGitHubToken()
                                if (token) {
                                    try {
                                        await saveMoodDiary()
                                        alert(`成功导入 ${recordCount} 条记录并保存到GitHub！`)
                                    } catch (error) {
                                        alert(`成功导入 ${recordCount} 条记录，但保存到GitHub失败：${error.message}\n\n数据已保存在浏览器中。`)
                                    }
                                } else {
                                    alert(`成功导入 ${recordCount} 条记录！数据已保存在浏览器中。`)
                                }

                            } catch (error) {
                                alert('读取文件失败：' + error.message + '\n\n请确保选择的是有效的JSON文件。')
                            }
                        }

                        reader.onerror = () => {
                            alert('读取文件时发生错误，请重试。')
                        }

                        reader.readAsText(file)
                    }

                    input.click()
                }

                // 加载心情日记数据
                const loadMoodDiary = async () => {
                    const token = getStoredGitHubToken()
                    if (!token) {
                        console.log('没有GitHub Token，无法加载日记数据')
                        return
                    }

                    isLoadingDiary.value = true
                    try {
                        const diaryData = await loadDiaryFromGitHub(token)
                        moodRecords.value = diaryData.records || {}
                        generateCalendar()
                    } catch (error) {
                        console.error('加载心情日记失败:', error)
                        alert('加载心情日记失败，请检查网络连接')
                    } finally {
                        isLoadingDiary.value = false
                    }
                }

                // 保存心情日记数据
                const saveMoodDiary = async () => {
                    const token = getStoredGitHubToken()
                    if (!token) {
                        alert('请先输入GitHub Token')
                        return
                    }

                    const diaryData = {
                        version: '1.0',
                        lastUpdated: new Date().toISOString(),
                        records: moodRecords.value
                    }

                    try {
                        await saveDiaryToGitHub(token, diaryData)
                        alert('心情日记已保存到GitHub！')
                    } catch (error) {
                        console.error('保存心情日记失败:', error)
                        alert('保存失败：' + error.message)
                    }
                }

                // ==================== 方法函数 ====================

                // 跳转到心情日历
                const goToMoodCalendar = () => {
                    currentStage.value = 'main'
                    activeTab.value = 'moodCalendar'

                    // 播放背景音乐
                    if (backgroundAudio.value) {
                        backgroundAudio.value.play().catch(e => console.log('自动播放失败，请用户交互后重试:', e))
                    }

                    // 如果有有效Token，加载日记数据
                    if (hasValidToken()) {
                        loadMoodDiary()
                    }
                }

                // 时间轴事件切换
                const toggleTimelineEvent = (index) => {
                    timelineData.value[index].expanded = !timelineData.value[index].expanded
                }

                // 相册切换
                const toggleAlbum = (index) => {
                    photoAlbums.value[index].expanded = !photoAlbums.value[index].expanded
                }

                // 选择测试答案
                const selectAnswer = (answerIndex) => {
                    if (quizData.value[currentQuestion.value].userAnswer !== null) return
                    
                    quizData.value[currentQuestion.value].userAnswer = answerIndex
                    
                    if (answerIndex === quizData.value[currentQuestion.value].correct) {
                        quizScore.value++
                    }
                }

                // 获取选项样式
                const getOptionClass = (index) => {
                    const question = quizData.value[currentQuestion.value]
                    if (question.userAnswer === null) {
                        return 'border-gray-200 hover:border-rose-300 hover:bg-rose-50'
                    }
                    
                    if (index === question.correct) {
                        return 'border-green-500 bg-green-50 text-green-700'
                    }
                    
                    if (index === question.userAnswer && index !== question.correct) {
                        return 'border-red-500 bg-red-50 text-red-700'
                    }
                    
                    return 'border-gray-200 text-gray-500'
                }

                // 显示答案图标
                const showAnswerIcon = (index) => {
                    const question = quizData.value[currentQuestion.value]
                    return question.userAnswer !== null && (index === question.correct || index === question.userAnswer)
                }

                // 获取答案图标
                const getAnswerIcon = (index) => {
                    const question = quizData.value[currentQuestion.value]
                    if (index === question.correct) {
                        return 'fas fa-check text-green-500'
                    }
                    if (index === question.userAnswer && index !== question.correct) {
                        return 'fas fa-times text-red-500'
                    }
                    return ''
                }

                // 下一题
                const nextQuestion = () => {
                    if (currentQuestion.value < quizData.value.length - 1) {
                        currentQuestion.value++
                    }
                }

                // 显示测试结果
                const showQuizResult = () => {
                    showQuizResultModal.value = true
                }

                // 关闭测试结果
                const closeQuizResult = () => {
                    showQuizResultModal.value = false
                }

                // 获取测试结果消息
                const getQuizResultMessage = () => {
                    const percentage = (quizScore.value / quizData.value.length) * 100
                    if (percentage >= 60) {
                        return '在天愿为比翼鸟，在地愿作连理枝！宝宝我们是天生一对！❤️'
                    } else {
                        return '你小子！竟然答错这么多！😠'
                    }
                }

                // 切换电台频道
                const switchChannel = (channel) => {
                    currentChannel.value = channel
                }

                // 打开情书
                const openLoveLetter = () => {
                    showLoveLetterModal.value = true
                }

                // 关闭情书
                const closeLoveLetter = () => {
                    showLoveLetterModal.value = false
                }

                // 打开图片画廊
                const openImageGallery = (source, eventIndex, imageIndex) => {
                    currentImageSource.value = source
                    currentImageEventIndex.value = eventIndex
                    currentImageIndex.value = imageIndex
                    
                    if (source === 'timeline') {
                        currentImage.value = timelineData.value[eventIndex].images[imageIndex]
                    } else if (source === 'gallery') {
                        currentImage.value = photoAlbums.value[eventIndex].images[imageIndex]
                    }
                    
                    showImageGallery.value = true
                }

                // 关闭图片画廊
                const closeImageGallery = () => {
                    showImageGallery.value = false
                }

                // 上一张图片
                const previousImage = () => {
                    if (currentImageIndex.value > 0) {
                        currentImageIndex.value--
                        
                        if (currentImageSource.value === 'timeline') {
                            currentImage.value = timelineData.value[currentImageEventIndex.value].images[currentImageIndex.value]
                        } else if (currentImageSource.value === 'gallery') {
                            currentImage.value = photoAlbums.value[currentImageEventIndex.value].images[currentImageIndex.value]
                        }
                    }
                }

                // 下一张图片
                const nextImage = () => {
                    if (currentImageSource.value === 'timeline') {
                        const eventImages = timelineData.value[currentImageEventIndex.value].images
                        if (currentImageIndex.value < eventImages.length - 1) {
                            currentImageIndex.value++
                            currentImage.value = eventImages[currentImageIndex.value]
                        }
                    } else if (currentImageSource.value === 'gallery') {
                        const albumImages = photoAlbums.value[currentImageEventIndex.value].images
                        if (currentImageIndex.value < albumImages.length - 1) {
                            currentImageIndex.value++
                            currentImage.value = albumImages[currentImageIndex.value]
                        }
                    }
                }

                // 获取照片形状
                const getPhotoShape = () => {
                    const shapes = [
                        'rounded-lg',
                        'rounded-t-lg',
                        'rounded-b-lg',
                        'rounded-l-lg',
                        'rounded-r-lg',
                        'rounded-full'
                    ]
                    return shapes[Math.floor(Math.random() * shapes.length)]
                }

                // 开场音频结束事件
                const onIntroAudioEnd = () => {
                    // 开场音频结束后停止播放
                    if (introAudio.value) {
                        introAudio.value.pause()
                        introAudio.value.currentTime = 0
                    }
                }

                // 切换静音状态
                const toggleMute = () => {
                    muted.value = !muted.value
                    if (introAudio.value) {
                        introAudio.value.muted = muted.value
                    }
                    if (backgroundAudio.value) {
                        backgroundAudio.value.muted = muted.value
                    }
                }

                // ==================== 生命周期钩子 ====================

                onMounted(async () => {
                    // 检查是否已有有效的GitHub Token
                    if (hasValidToken()) {
                        const token = getStoredGitHubToken()

                        // 验证Token是否仍然有效
                        try {
                            const isValid = await validateGitHubToken(token)

                            if (isValid) {
                                // 如果有有效Token，直接进入封面页面
                                currentStage.value = 'entrance'
                                // 页面加载动画
                                anime({
                                    targets: '.relative.z-10 > *',
                                    opacity: [0, 1],
                                    translateY: [50, 0],
                                    delay: anime.stagger(200),
                                    duration: 1000,
                                    easing: 'easeOutQuart'
                                })
                                // 播放开场音乐
                                if (introAudio.value) {
                                    introAudio.value.play().catch(e => console.log('自动播放失败，请用户交互后重试:', e))
                                }
                            } else {
                                // Token失效，清除存储
                                clearGitHubToken()
                                console.log('存储的Token已失效，需要重新输入')
                            }
                        } catch (error) {
                            console.error('Token验证失败:', error)
                            clearGitHubToken()
                        }
                    }
                    // 如果没有有效Token，保持在Token输入页面

                    // 初始化日历（如果有有效Token，也加载数据）
                    if (hasValidToken()) {
                        generateCalendar()
                        // 异步加载日记数据
                        loadMoodDiary()
                    }
                })

                return {
                    // GitHub Token相关数据
                    githubToken,
                    showToken,
                    tokenError,
                    tokenShake,
                    tokenErrorMessage,
                    tokenInputRef,
                    // 数据
                    audioResources,
                    imageResources,
                    birthdayMessage,
                    birthdaySubtitle,
                    unlockButtonText,
                    navTitle,
                    tabs,
                    timelineTitle,
                    timelineSubtitle,
                    galleryTitle,
                    gallerySubtitle,
                    quizTitle,
                    quizSubtitle,
                    radioTitle,
                    radioSubtitle,
                    currentStage,
                    activeTab,
                    isBoxAnimating,
                    showVolumeControl,
                    muted,
                    timelineData,
                    photoAlbums,
                    quizData,
                    currentQuestion,
                    quizScore,
                    currentChannel,
                    showLoveLetterModal,
                    showQuizResultModal,
                    showImageGallery,
                    currentImageSource,
                    currentImageEventIndex,
                    currentImageIndex,
                    currentImage,
                    // 心情日历数据
                    moodCalendarTitle,
                    moodCalendarSubtitle,
                    currentMonth,
                    currentYear,
                    calendarDays,
                    weekDays,
                    moodRecords,
                    isLoadingDiary,
                    currentMonthMoodStats,
                    availableMoods,
                    // 心情编辑器状态
                    showMoodEditor,
                    editingDate,
                    editingMood,
                    editingText,
                    hasExistingRecord,
                    isSaving,
                    saveError,
                    // 音频元素
                    introAudio,
                    backgroundAudio,
                    // GitHub Token验证方法
                    toggleTokenVisibility,
                    verifyGitHubToken,
                    // 心情日历方法
                    currentMonthYear,
                    isToday,
                    getDayClasses,
                    getDateTextClass,
                    hasMoodRecord,
                    getMoodEmoji,
                    getMoodTextPreview,
                    getMoodColorClass,
                    prevMonth,
                    nextMonth,
                    goToToday,
                    openMoodEditor,
                    exportMoodData,
                    importMoodData,
                    loadMoodDiary,
                    saveMoodDiary,
                    // 心情编辑器方法
                    closeMoodEditor,
                    selectMood,
                    getMoodButtonClass,
                    getMoodDescription,
                    formatEditorDate,
                    saveMoodRecord,
                    deleteMoodRecord,
                    // 方法
                    unlockMemoryBook,
                    goToMoodCalendar,
                    toggleTimelineEvent,
                    toggleAlbum,
                    selectAnswer,
                    getOptionClass,
                    showAnswerIcon,
                    getAnswerIcon,
                    nextQuestion,
                    showQuizResult,
                    closeQuizResult,
                    getQuizResultMessage,
                    switchChannel,
                    openLoveLetter,
                    closeLoveLetter,
                    openImageGallery,
                    closeImageGallery,
                    previousImage,
                    nextImage,
                    getPhotoShape,
                    onIntroAudioEnd,
                    toggleMute
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
        }).mount('#app');
    </script>
